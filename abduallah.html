<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة خاصة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #8b0000;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- تصميم الخلفية المليئة بالكلمات --- */
        .bg-pattern {
            position: absolute;
            top: -50vh; 
            left: -50vw; 
            width: 200vw; 
            height: 200vh;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            z-index: 1;
            pointer-events: none; /* عشان متأثرش على الضغطات */
            opacity: 0.12; /* شفافة عشان تكون خلفية هادية */
            transform: rotate(-25deg); /* ميلان الكلمات */
        }
        .bg-pattern span {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            margin: 10px 20px;
            white-space: nowrap;
            user-select: none;
        }

        .container {
            background-color: #8b0000;
            border: 4px solid #000000;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
        }
        button {
            background-color: #000000;
            color: white;
            border: 2px solid #ffffff;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        button:hover {
            background-color: #333333;
            transform: scale(1.05);
        }
        .message {
            font-size: 19px;
            color: #ffffff;
            line-height: 1.8;
            white-space: pre-line;
            font-weight: 500;
        }
        .title {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        /* --- تصميم القلوب المتطايرة --- */
        .floating-item {
            position: absolute;
            user-select: none;
            pointer-events: none;
            animation: floatOut 2.5s ease-out forwards;
            z-index: 5;
            font-size: 24px;
        }
        @keyframes floatOut {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }
            100% {
                /* المتغيرات tx و ty بيتم حسابهم في الجافاسكريبت */
                transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- حاوية الخلفية سيتم ملؤها بالجافاسكريبت -->
    <div class="bg-pattern" id="bgPattern"></div>

    <div class="container" id="mainBox">
        <button onclick="showMessage()">اضغطي يعجلة ومتخافيش ❤️</button>
    </div>

    <script>
        // 1. توليد الكلمات في الخلفية فور فتح الصفحة
        const bgPattern = document.getElementById('bgPattern');
        let bgText = "";
        // نكرر الكلمة 400 مرة عشان تملأ الشاشة بالكامل
        for (let i = 0; i < 400; i++) {
            bgText += "<span>بحبك - I Love You</span>";
        }
        bgPattern.innerHTML = bgText;

        // 2. دالة إظهار الرسالة
        function showMessage() {
            const box = document.getElementById('mainBox');
            box.innerHTML = `
                <div class="title">فطومتي جوزتي حبيبتي 😍❤❤</div>
                <div class="message" id="msgText">
                     لو عملتي اى وبلكتي مهما بلكتي وزعلتي مهما زعلتي م هسيبك بردو وم هشمتهم فيكي والله واعمل اي حاجه علشانك بس نتي الل بارده ومستفزه نتي وعيلتك كلها ومتسمعيش كلام صحابك ماشي يبنت مريم<br><br>
                    بحبك 😍😍🖐🏻
                </div>
            `;
            
            // تشغيل انيميشن تطاير القلوب كل 200 جزء من الثانية
            setInterval(createFloatingItems, 200);
        }

        // 3. دالة تطاير القلوب والايموجي من المنتصف (مكتملة ومصلحة)
        function createFloatingItems() {
            const container = document.getElementById('mainBox');
            const rect = container.getBoundingClientRect();
            
            const item = document.createElement('div');
            item.classList.add('floating-item');
            
            // اختيار إيموجي عشوائي
            const emojis = ['❤️', '💖', '😍', '💕', '🥰'];
            item.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            
            // تحديد نقطة الانطلاق لتكون منتصف الصندوق تماماً
            const startX = rect.left + (rect.width / 2);
            const startY = rect.top + (rect.height / 2);
            item.style.left = startX + 'px';
            item.style.top = startY + 'px';
            
            // حساب مسافة وزاوية عشوائية لينطلق إليها القلب (نصف قطر الانتشار)
            const angle = Math.random() * Math.PI * 2; // زاوية عشوائية 360 درجة
            const distance = Math.random() * 400 + 150; // مسافة التطاير للخارج
            
            const tx = Math.cos(angle) * distance + 'px';
            const ty = Math.sin(angle) * distance + 'px';
            
            // إرسال الإحداثيات لملف الـ CSS
            item.style.setProperty('--tx', tx);
            item.style.setProperty('--ty', ty);
            
            document.body.appendChild(item);
            
            // مسح القلب من الصفحة بعد انتهاء حركته لتخفيف الحمل على المتصفح
            setTimeout(() => {
                item.remove();
            }, 2500);
        }
    </script>
</body>
</html>
